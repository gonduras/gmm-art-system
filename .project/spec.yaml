specVersion: v2
specMinorVersion: 2
meta:
    name: gmm-art-system
    image: project-gmm-art-system
    description: GMM Art System
    labels: []
    createdOn: "2026-09-02T16:19:23Z"
    defaultBranch: main
layout:
    - path: code/
      type: code
      storage: git
    - path: models/
      type: models
      storage: gitlfs
    - path: data/
      type: data
      storage: gitlfs
    - path: data/scratch/
      type: data
      storage: gitignore
environment:
    base:
        registry: nvcr.io
        image: nvidia/ai-workbench/python-cuda124:1.0.3
        build_timestamp: "20260112184535"
        name: Python with CUDA 12.4
        supported_architectures: []
        cuda_version: "12.4"
        description: A Python Base with CUDA 12.4
        entrypoint_script: ""
        labels:
            - cuda12.4
        apps:
            - name: jupyterlab
              type: jupyterlab
              class: webapp
              start_command: jupyter lab --allow-root --port 8888 --ip 0.0.0.0 --no-browser --NotebookApp.base_url=$PROXY_PREFIX --NotebookApp.default_url=/lab --NotebookApp.allow_origin='*'
              health_check_command: '[ $(echo url=$(jupyter lab list | head -n 2 | tail -n 1 | cut -f1 -d'' '' | grep -v ''Currently'' | sed ''s@/?@/lab?@g'') | curl -o /dev/null -s -w ''%{http_code}'' --config -) == ''200'' ]'
              stop_command: jupyter lab stop 8888
              user_msg: ""
              logfile_path: ""
              timeout_seconds: 60
              icon_url: ""
              webapp_options:
                autolaunch: true
                port: "8888"
                proxy:
                    trim_prefix: false
                url_command: jupyter lab list | head -n 2 | tail -n 1 | cut -f1 -d' ' | grep -v 'Currently'
        programming_languages:
            - python3
        icon_url: https://workbench.download.nvidia.com/static/img/ai-workbench-icon-rectangle.jpg
        image_version: 1.0.3
        os: linux
        os_distro: ubuntu
        os_distro_release: "22.04"
        schema_version: v2
        user_info:
            uid: ""
            gid: ""
            username: ""
        package_managers:
            - name: apt
              binary_path: /usr/bin/apt
              installed_packages:
                - curl
                - git
                - git-lfs
                - python3
                - gcc
                - python3-dev
                - python3-pip
                - vim
                - libxcb1
                - libx11-xcb1
                - libgl1
                - libglib2.0-0
            - name: pip
              binary_path: /usr/bin/pip
              installed_packages:
                - jupyterlab==4.3.6
        package_manager_environment:
            name: ""
            target: ""
    compose_file_path: ""
execution:
    apps:
        - name: 6-Axis-Science-Calibration
          type: custom
          class: webapp
          start_command: export PROXY_PREFIX && streamlit run /project/gmm/scripts/gondurastration_science_calibration.py --server.port 8501 --server.address 0.0.0.0 --server.baseUrlPath="$PROXY_PREFIX"
          health_check_command: curl -I http://localhost:8501
          stop_command: pkill -f 'streamlit run /project/gmm/scripts/gondurastration_science_calibration.py'
          user_msg: ""
          logfile_path: ""
          timeout_seconds: 60
          icon_url: ""
          webapp_options:
            autolaunch: true
            port: "8501"
            proxy:
                trim_prefix: false
            url: http://localhost:8501
    resources:
        gpu:
            requested: 1
        sharedMemoryMB: 1024
    secrets: []
    mounts:
        - type: project
          target: /project/
          description: Project directory
          options: rw
        - type: host
          target: /project/gmm/
          description: 'GMM Full Project Root on G:'
          options: rw
